<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bangers&display=block" rel="stylesheet">
<style>html,body{margin:0;width:512px;height:512px;overflow:hidden;background:#FFD23F}</style>
</head><body>
<svg id="s" width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="common.js"></script>
<script>
// Imagen de cada pase y producto de la tienda (Config.Passes y Config.Products).
// items.html?id=x2Food dibuja ese artículo a 512x512. render_items.py las exporta todas a art/promo/items/.
const G = "#FFC233", GD = "#D9901A", JELLY = "#F5A623", PURPLE = "#A66CFF", PINK = "#FF7BB0";
const ink = (w = 9) => `stroke="${C.ink}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const at = (x, y, s = 1, r = 0, body = "") => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${s})">${body}</g>`;
const use = (id, x, y, s = 1, r = 0) => at(x, y, s, r, `<use href="#${id}"/>`);

// --- Piezas ---
const jar = (lid = C.red) => `
  <path d="M-70,-50 L70,-50 L80,90 Q80,110 60,110 L-60,110 Q-80,110 -80,90 Z" fill="${JELLY}" ${ink()}/>
  <path d="M-60,-30 L-50,90" stroke="#FFE7A8" stroke-width="14" stroke-linecap="round" opacity=".8"/>
  <rect x="-84" y="-92" width="168" height="46" rx="10" fill="${lid}" ${ink()}/>
  <rect x="-50" y="10" width="100" height="56" rx="8" fill="${C.paper}" ${ink(7)}/>
  <path d="M-30,30 q30,26 60,0" fill="none" ${ink(7)}/>`;
const potion = (liq = PINK) => `
  <rect x="-24" y="-118" width="48" height="40" rx="6" fill="${C.crumb}" ${ink()}/>
  <path d="M-30,-80 L30,-80 L30,-40 Q100,-10 96,60 Q90,120 0,120 Q-90,120 -96,60 Q-100,-10 -30,-40 Z" fill="#E8F7FF" ${ink()}/>
  <path d="M-88,40 Q0,10 88,40 Q86,112 0,112 Q-86,112 -88,40 Z" fill="${liq}"/>
  <path d="M-30,-80 L30,-80 L30,-40 Q100,-10 96,60 Q90,120 0,120 Q-90,120 -96,60 Q-100,-10 -30,-40 Z" fill="none" ${ink()}/>
  <circle cx="-30" cy="60" r="10" fill="white" opacity=".8"/><circle cx="20" cy="80" r="6" fill="white" opacity=".8"/>
  <path d="M-60,0 Q-70,30 -64,50" stroke="white" stroke-width="12" fill="none" stroke-linecap="round" opacity=".8"/>`;
const sack = () => `
  <path d="M-40,-80 Q0,-60 40,-80 L30,-50 Q110,0 100,70 Q90,120 0,120 Q-90,120 -100,70 Q-110,0 -30,-50 Z" fill="#D9B07A" ${ink()}/>
  <path d="M-40,-52 Q0,-36 40,-52" fill="none" ${ink(10)}/>
  <path d="M-46,-86 Q-30,-110 -10,-84 M46,-86 Q30,-110 10,-84" fill="none" ${ink(8)}/>
  <path d="M-60,10 Q-70,50 -50,90" stroke="#F0D3A4" stroke-width="12" fill="none" stroke-linecap="round"/>`;
const crate = () => `
  <rect x="-100" y="-80" width="200" height="170" rx="8" fill="#C98A4B" ${ink()}/>
  <path d="M-100,-24 L100,-24 M-100,34 L100,34" ${ink(8)}/>
  <path d="M-100,-80 L100,90" ${ink(10)} opacity=".9"/>
  <rect x="-100" y="-80" width="200" height="170" rx="8" fill="none" ${ink()}/>`;
const shovel = (blade = "#B7C3CC") => `
  <rect x="-10" y="-150" width="20" height="170" rx="8" fill="${C.crumb}" ${ink(8)}/>
  <path d="M-40,-170 L40,-170 L30,-140 L-30,-140 Z" fill="${C.crumb}" ${ink(8)}/>
  <path d="M-58,10 L58,10 L58,60 Q58,120 0,140 Q-58,120 -58,60 Z" fill="${blade}" ${ink()}/>
  <path d="M-36,30 L-36,90" stroke="white" stroke-width="12" stroke-linecap="round" opacity=".7"/>`;
const mound = (c = C.dirt) => `
  <path d="M-170,80 Q-120,-60 0,-80 Q120,-60 170,80 Z" fill="${c}" ${ink()}/>
  <ellipse cx="0" cy="40" rx="34" ry="26" fill="${C.ink}"/>`;
const key = () => `
  <circle cx="-70" cy="0" r="56" fill="${G}" ${ink()}/><circle cx="-70" cy="0" r="22" fill="${C.paper}" ${ink(8)}/>
  <path d="M-16,-16 L120,-16 L120,16 L96,16 L96,50 L70,50 L70,16 L50,16 L50,40 L26,40 L26,16 L-16,16 Z" fill="${G}" ${ink()}/>
  <path d="M-100,-30 Q-110,-10 -104,10" stroke="white" stroke-width="10" fill="none" stroke-linecap="round" opacity=".8"/>`;
const crown = () => `
  <path d="M-120,70 L-130,-60 L-60,0 L0,-90 L60,0 L130,-60 L120,70 Z" fill="${G}" ${ink(10)}/>
  <rect x="-124" y="56" width="248" height="40" rx="8" fill="${GD}" ${ink(9)}/>
  <circle cx="0" cy="20" r="18" fill="${C.red}" ${ink(7)}/><circle cx="-70" cy="30" r="13" fill="${C.cyan}" ${ink(6)}/><circle cx="70" cy="30" r="13" fill="${C.green}" ${ink(6)}/>
  <circle cx="-130" cy="-60" r="14" fill="${G}" ${ink(7)}/><circle cx="0" cy="-90" r="14" fill="${G}" ${ink(7)}/><circle cx="130" cy="-60" r="14" fill="${G}" ${ink(7)}/>`;
const egg = () => `
  <path d="M0,-130 Q90,-120 100,30 Q100,130 0,130 Q-100,130 -100,30 Q-90,-120 0,-130 Z" fill="${G}" ${ink(10)}/>
  <ellipse cx="-40" cy="-50" rx="20" ry="36" fill="#FFF1B8" transform="rotate(20 -40 -50)"/>
  <path d="M-60,40 l20,-20 l20,20 l20,-20 l20,20 l20,-20 l20,20" fill="none" stroke="${GD}" stroke-width="10" stroke-linejoin="round"/>`;
const magnet = () => `
  <path d="M-100,-20 A100,100 0 0 1 100,-20 L100,90 L50,90 L50,-20 A50,50 0 0 0 -50,-20 L-50,90 L-100,90 Z" fill="${C.red}" ${ink(10)}/>
  <rect x="-100" y="60" width="50" height="40" fill="#E8EEF2" ${ink(9)}/><rect x="50" y="60" width="50" height="40" fill="#E8EEF2" ${ink(9)}/>`;
const bolt = (c = C.yellow) => `<path d="M20,-130 L-60,10 L-6,10 L-30,130 L60,-20 L6,-20 Z" fill="${c}" ${ink(10)}/>`;
const giftBox = (c = C.cyan, r = C.red) => `
  <rect x="-100" y="-30" width="200" height="140" rx="8" fill="${c}" ${ink()}/>
  <rect x="-112" y="-70" width="224" height="50" rx="8" fill="${c}" ${ink()}/>
  <rect x="-20" y="-70" width="40" height="180" fill="${r}" ${ink(8)}/>
  <path d="M0,-70 Q-80,-150 -70,-90 Q-60,-70 0,-70 Q60,-70 70,-90 Q80,-150 0,-70 Z" fill="${r}" ${ink(8)}/>`;
const bow = (r = C.red) => `<path d="M0,0 Q-70,-60 -60,0 Q-70,60 0,0 Q70,60 60,0 Q70,-60 0,0 Z" fill="${r}" ${ink(8)}/><circle r="14" fill="${r}" ${ink(7)}/>`;
const wings = (c = G) => `
  <path d="M-30,0 Q-170,-140 -200,-20 Q-170,40 -30,20 Z" fill="${c}" ${ink(9)} opacity=".95"/>
  <path d="M30,0 Q170,-140 200,-20 Q170,40 30,20 Z" fill="${c}" ${ink(9)} opacity=".95"/>
  <path d="M-60,-10 Q-120,-60 -160,-30 M60,-10 Q120,-60 160,-30" fill="none" stroke="#FFF1B8" stroke-width="9" stroke-linecap="round"/>`;
const barrel = () => `
  <path d="M-80,-110 Q-110,0 -80,110 L80,110 Q110,0 80,-110 Z" fill="#B4703A" ${ink()}/>
  <ellipse cx="0" cy="-110" rx="80" ry="20" fill="${JELLY}" ${ink(8)}/>
  <path d="M-98,-50 L98,-50 M-98,50 L98,50" stroke="#7A7F86" stroke-width="16"/>
  <path d="M-98,-50 L98,-50 M-98,50 L98,50" ${ink(5)} fill="none"/>
  <path d="M-40,-90 L-46,90 M40,-90 L46,90" stroke="#8C5428" stroke-width="7"/>`;
const wheelbarrow = () => `
  <path d="M-140,-40 L120,-40 L80,60 L-110,60 Z" fill="${C.green}" ${ink()}/>
  <path d="M-110,60 L-150,110 M80,60 L170,40" ${ink(10)}/>
  <circle cx="-40" cy="100" r="34" fill="#555" ${ink(9)}/><circle cx="-40" cy="100" r="10" fill="#ccc"/>`;
const backpack = () => `
  <rect x="-90" y="-90" width="180" height="200" rx="40" fill="${C.cyan}" ${ink()}/>
  <path d="M-50,-90 Q-50,-140 0,-140 Q50,-140 50,-90" fill="none" ${ink(12)}/>
  <rect x="-60" y="20" width="120" height="70" rx="16" fill="#2F9BD0" ${ink(8)}/>
  <path d="M-60,40 L60,40" ${ink(6)}/>`;
const cloud = () => `<path d="M-120,40 Q-160,40 -150,0 Q-150,-40 -100,-40 Q-90,-90 -30,-80 Q10,-120 60,-80 Q120,-90 120,-30 Q160,-20 150,20 Q150,50 110,50 Z" fill="white" ${ink(9)}/>`;
const leg = () => `
  <path d="M-120,-60 L20,-110 L40,-80 L-100,-20 Z" fill="${C.green}" ${ink(9)}/>
  <path d="M20,-100 L110,100 L84,110 L4,-84 Z" fill="#4FA83E" ${ink(9)}/>
  <path d="M70,10 l18,-6 M86,46 l18,-6" ${ink(6)}/>
  <path d="M110,100 L150,110 L84,110 Z" fill="#4FA83E" ${ink(8)}/>`;
const speedLines = (x = -230, y = 0) => `<g stroke="${C.ink}" stroke-width="10" stroke-linecap="round">
  <path d="M${x},${y - 40} l60,0"/><path d="M${x - 20},${y} l80,0"/><path d="M${x},${y + 40} l60,0"/></g>`;
const flag = (c = C.red) => `<path d="M0,0 L0,-110" ${ink(8)}/><path d="M0,-110 L70,-90 L0,-66 Z" fill="${c}" ${ink(7)}/>`;
const crumbs = (pts) => pts.map(([x, y, s, r]) => use("crumb", x, y, s, r)).join("");
const goldCrumb = (x, y, s = 1, r = 0) => at(x, y, s, r, `<path d="M-14,-8 L4,-16 L16,-2 L8,14 L-10,12 Z" fill="${G}" ${ink(5)}/>`);
const tag = (text, x = 256, y = 456, size = 84, fill = C.yellow, shadow = C.red, rot = -5) => titleText(x, y, size, text, rot, fill, shadow);

// --- Fondos por grupo ---
const BG = {
  forever: ["#FFD23F", "#FFE680"], look: ["#FF9EC4", "#FFC7DC"], advance: ["#96623C", "#B98257"],
  time: ["#6EC85A", "#9BDD8B"], boost: ["#3EC1F3", "#8ADBFA"], jelly: ["#A66CFF", "#C9A6FF"],
  all: ["#E63946", "#FF7A84"], gift: ["#FF7BB0", "#FFB3D1"],
};

// --- Artículos ---
const ITEMS = {
  // Pases
  x2Food:      ["forever", () => use("cookie", 256, 230, 1.35, -10) + tag("x2", 400, 140, 150, C.paper, C.red, 8)],
  autoBite:    ["forever", () => use("ant", 220, 250, 1.05) + use("cookie", 360, 320, .7, -14) + tag("AUTO")],
  fastColony:  ["forever", () => use("ant", 150, 250, .6) + use("ant", 280, 220, .7) + use("ant", 400, 260, .6) + speedLines(90, 250) + tag("x2", 256, 456, 110)],
  goldWings:   ["forever", () => at(256, 220, 1, 0, wings()) + use("ant", 256, 260, .95)],
  vip:         ["forever", () => at(256, 200, 1.15, -4, crown()) + tag("VIP", 256, 440, 130)],
  x2Jelly:     ["forever", () => at(240, 250, 1.15, 0, jar()) + tag("x2", 390, 150, 140, C.paper, PURPLE, 8)],
  turbo:       ["forever", () => use("ant", 290, 250, 1.05) + speedLines(70, 260) + tag("+30%")],
  bigStore:    ["forever", () => at(256, 250, 1.1, 0, crate()) + use("cookie", 200, 140, .5, -10) + use("donut", 310, 145, .45, 10) + tag("24 H")],
  bigCarry:    ["forever", () => at(256, 250, 1.1, 0, backpack()) + crumbs([[180, 110, 2.2, 10], [260, 96, 2.6, -20], [340, 116, 2, 40]]) + tag("+50%")],
  starterPack: ["forever", () => at(256, 260, 1.2, 0, giftBox(C.green, C.red)) + tag("INICIO", 256, 466, 76)],
  goldHill:    ["look",    () => at(256, 290, 1.25, 0, mound(G)) + at(320, 210, 1, 0, flag(C.red)) + crumbs([[150, 150, 1.6, 0]]) + `<g fill="white" stroke="${C.ink}" stroke-width="5"><path d="M150,120 l8,18 l20,2 l-15,13 l5,20 l-18,-10 l-18,10 l5,-20 l-15,-13 l20,-2z"/><path d="M390,150 l6,14 l15,1 l-11,10 l4,15 l-14,-8 l-14,8 l4,-15 l-11,-10 l15,-1z"/></g>`],

  // Productos
  dig1:        ["advance", () => at(256, 330, 1, 0, mound()) + at(300, 190, .9, 25, shovel()) + tag("CAPA 2-4", 256, 470, 70)],
  dig2:        ["advance", () => at(256, 330, 1, 0, mound()) + at(300, 190, 1, 25, shovel("#9BC6E0")) + tag("CAPA 5-8", 256, 470, 70)],
  dig3:        ["advance", () => at(256, 330, 1, 0, mound()) + at(300, 190, 1.05, 25, shovel("#7A8794")) + tag("CAPA 9-12", 256, 470, 66)],
  dig4:        ["advance", () => at(256, 330, 1, 0, mound()) + at(300, 190, 1.1, 25, shovel(C.red)) + tag("CAPA 13-14", 256, 470, 62)],
  halfDig:     ["advance", () => at(256, 250, 1.15, 25, shovel(G)) + tag("½", 390, 170, 150, C.paper, C.red, 8)],
  zoneKey:     ["advance", () => at(256, 230, 1.2, -20, key()) + tag("30 MIN")],
  sack:        ["time",    () => at(256, 240, 1.25, 0, sack()) + tag("15 MIN")],
  crate:       ["time",    () => at(256, 250, 1.1, 0, crate()) + use("cookie", 200, 140, .5, -10) + use("strawberry", 320, 140, .55, 10) + tag("1 H")],
  bigSack:     ["time",    () => at(256, 250, 1.1, 0, wheelbarrow()) + at(230, 150, .7, 0, sack()) + tag("4 H")],
  frenzy:      ["time",    () => use("ant", 230, 260, .95) + at(390, 200, .9, 10, bolt()) + tag("x3")],
  egg:         ["time",    () => at(256, 240, 1.25, -8, egg()) + crumbs([]) + `<g fill="white" stroke="${C.ink}" stroke-width="5"><path d="M120,130 l8,18 l20,2 l-15,13 l5,20 l-18,-10 l-18,10 l5,-20 l-15,-13 l20,-2z"/><path d="M400,320 l6,14 l15,1 l-11,10 l4,15 l-14,-8 l-14,8 l4,-15 l-11,-10 l15,-1z"/></g>`],
  potion:      ["boost",   () => at(256, 240, 1.25, 0, potion()) + tag("x2 · 15 MIN", 256, 460, 66)],
  bigPotion:   ["boost",   () => at(256, 240, 1.45, 0, potion(C.red)) + tag("x2 · 1 H", 256, 466, 76)],
  speedBoost:  ["boost",   () => at(256, 250, 1.2, 0, leg()) + speedLines(80, 230) + tag("+40%")],
  magnet:      ["boost",   () => at(256, 250, 1.15, 180, magnet()) + crumbs([[150, 400, 2, 10], [250, 420, 2.2, -30], [360, 400, 2, 50]]) + tag("IMÁN", 256, 100, 80, C.paper, C.red, -4)],
  jellyBoost:  ["jelly",   () => at(256, 250, 1.15, 0, jar(PURPLE)) + tag("x2", 400, 140, 140, C.paper, C.red, 8)],
  jar:         ["jelly",   () => at(256, 240, 1.25, 0, jar()) + tag("+5", 256, 466, 100)],
  bigJar:      ["jelly",   () => at(256, 240, 1.25, 0, barrel()) + tag("+30", 256, 466, 100)],
  feast:       ["all",     () => use("donut", 170, 280, .9, -10) + use("cookie", 330, 290, .9, 10) + use("strawberry", 256, 170, .9) + tag("x2 PARA TODAS", 256, 460, 56)],
  goldRain:    ["all",     () => at(256, 150, 1.2, 0, cloud()) + goldCrumb(150, 300, 3, 10) + goldCrumb(260, 340, 3.4, -20) + goldCrumb(370, 290, 3, 40) + goldCrumb(200, 400, 2.4, 70) + goldCrumb(320, 420, 2.4, 0) + tag("ORO PARA TODAS", 256, 486, 52)],
  giftPotion:  ["gift",    () => at(256, 240, 1.2, 0, potion()) + at(256, 115, .8, 0, bow()) + tag("REGALO")],
  giftSack:    ["gift",    () => at(256, 250, 1.2, 0, sack()) + at(256, 160, .8, 0, bow()) + tag("REGALO")],
};

const id = new URLSearchParams(location.search).get("id") || "x2Food";
const [group, draw] = ITEMS[id];
const [bg, ray] = BG[group];
document.body.style.background = bg;
document.getElementById("s").innerHTML = `<defs>${DEFS}
  <radialGradient id="fade" cx=".5" cy=".45" r=".6"><stop offset=".45" stop-color="black"/><stop offset="1" stop-color="white"/></radialGradient>
  <mask id="cornerDots"><rect width="512" height="512" fill="url(#fade)"/></mask>
</defs>
<rect width="512" height="512" fill="${bg}"/>
${rays(256, 240, 520, 18, ray, 1)}
<rect width="512" height="512" fill="url(#dots)" opacity=".18" mask="url(#cornerDots)"/>
<polygon points="${burst(256, 246, 232, 180, 16, 0.1)}" fill="${C.paper}" stroke="${C.ink}" stroke-width="10" stroke-linejoin="round"/>
${draw()}`;
window.ITEM_IDS = Object.keys(ITEMS);
document.fonts.ready.then(() => document.body.dataset.ready = "1");
</script>
</body></html>
